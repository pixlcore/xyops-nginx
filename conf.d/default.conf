# ---------- WebSocket support ----------
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# ---------- HTTP / HTTPS configuration ----------
# Port 80 is useful for quick local testing, while port 443 is always enabled
# using the default self-signed certs baked into the image.
server {
	listen 80;
	listen 443 ssl;
	
	# These default files are generated by the Dockerfile, and can be
	# overwritten by bind mounts for real deployments.
	ssl_certificate     /etc/tls.crt;
	ssl_certificate_key /etc/tls.key;
	
	# ---- xyOps backend ----
	location / {
		proxy_set_header Host               $host;
		proxy_set_header X-Real-IP          $remote_addr;
		proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host   $host;
		proxy_set_header X-Forwarded-Proto  $scheme;
		
		# Support for WebSockets
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 30s;
		proxy_send_timeout 30s;
		
		# Pass along to xyOps
		proxy_pass http://backend;
	}
}
